<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>details</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-card>
  <ion-card-header>
    <img src= "https://image.tmdb.org/t/p/w500{{personInfo?.profile_path}}" width="500"/>
    <ion-card-title>{{personInfo?.name}}</ion-card-title>
    <ion-card-subtitle>{{personInfo?.birthday}}</ion-card-subtitle>
  </ion-card-header>
</ion-card>
</ion-content>
